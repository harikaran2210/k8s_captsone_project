apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-app
  namespace: training-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: training-app
  template:
    metadata:
      labels:
        app: training-app
      annotations:
        capstone.redington/release: "v2"
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: training-config
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: training-secret
                  key: demo-token
          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: html-content
          configMap:
            name: training-html
